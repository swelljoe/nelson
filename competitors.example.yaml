# Example competitor roster for `nelson bench loop --competitors <this file>`.
#
# A competitor is a (model x runtime x tool-profile). The loop upserts every
# entry here as `active` and flips any DB competitor *absent* from this list to
# `retired` (its historical runs are kept and stay scoreable) — so adding or
# removing a competitor is pure config, not code.
#
# `name` (a stable identifier) and `model` are required; everything else is
# optional. `knowledge_cutoff` powers the recency gate and age-out: a case is
# only run against a competitor when disclosed after its cutoff, and a case is
# aged out once it predates every active competitor's cutoff. `auth_profile`
# names a secret profile (never a secret value); subscription-auth runtimes
# (claude-code, gemini-cli) inherit the signed-in host CLI and need none, while
# API-key runtimes (raw-api-loop and the native vendor CLIs) name a profile from
# nelson/auth.py whose value the benchmark machine supplies via the environment.
#
# Runtimes (the invocation method): `claude-code` and `gemini-cli` bind-mount the
# signed-in host CLI; `raw-api-loop` is the shared agentic harness (a sandboxed
# read/grep ReAct agent driving any OpenAI-compatible endpoint), so swapping the
# model is an apples-to-apples comparison. A non-Anthropic model with an *official*
# Anthropic-compatible endpoint (e.g. DeepSeek) also runs through the real
# `claude-code` harness: set runtime `claude-code`, an `anthropic_base_url` (+ model
# mapping `env`) in `cost_model`, and an auth_profile carrying the provider token —
# this is preferred over an unofficial third-party CLI. `kimi-cli` / `pi-custom` are
# native vendor agents — wired here but stubbed until their CLI is installed and
# verified (an absent binary cleanly resolves to infra_error, never a miss).
#
# For `raw-api-loop`, `cost_model` is a QUOTED JSON string carrying the endpoint
# `base_url` and optional per-million-token pricing (`input_usd_per_mtok` /
# `output_usd_per_mtok`); pricing is best-effort (tokens are always recorded, cost
# is null without it). The same pricing keys also set cost for a non-Anthropic
# model run via `claude-code` over an Anthropic-compatible endpoint: claude's own
# reported cost prices the *mapped Anthropic model*, not the provider, so declared
# pricing overrides it (native claude declares none and keeps its real cost).
# Prices below are USD/MTok, standard tier, verified 2026-05-28 (see per-entry
# notes); update when a provider's promo expires. VERIFY-AT-WIRING: confirm each
# provider's real base_url, model id, and key env-var name before a live run.

- name: claude-code/sonnet
  model: sonnet
  runtime: claude-code
  tool_profile: read-grep
  cost_model: subscription
  size_class: medium
  knowledge_cutoff: 2025-06

- name: claude-code/haiku
  model: haiku
  runtime: claude-code
  tool_profile: read-grep
  cost_model: subscription
  size_class: small
  knowledge_cutoff: 2025-06

# DeepSeek through the real Claude Code harness (its official Anthropic-compatible
# endpoint). Same model, trusted agent. cost_model carries the endpoint + the model
# mapping env claude reads; auth_profile supplies the token as ANTHROPIC_AUTH_TOKEN.
# VERIFY-AT-WIRING: confirm base_url + model ids against api-docs.deepseek.com.
# PRICING: deepseek-v4-pro is 75% off (0.435/0.87) until 2026-05-31 15:59 UTC;
# standard rate after is 1.74/3.48 — UPDATE then. (claude reports an Anthropic-priced
# cost for this third-party model, so the declared pricing below overrides it.)
# CLIENT PIN: Claude Code 2.1.156 puts a `system`-role entry in the messages array,
# which DeepSeek's anthropic proxy rejects (400 "messages[1].role ... got 'system'");
# 2.1.153 does not. `claude_bin` mounts that older host binary read-only for THIS
# competitor only — host claude/judges stay current. HOST-SPECIFIC PATH; re-verify
# when DeepSeek's endpoint accepts the newer shape (then drop the pin).
- name: claude-code/deepseek
  model: deepseek-v4-pro          # VERIFY-AT-WIRING: real model id
  runtime: claude-code
  tool_profile: read-grep
  auth_profile: deepseek-anthropic
  cost_model: '{"anthropic_base_url": "https://api.deepseek.com/anthropic", "env": {"ANTHROPIC_MODEL": "deepseek-v4-pro", "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-pro", "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-pro", "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash"}, "input_usd_per_mtok": 0.435, "output_usd_per_mtok": 0.87, "claude_bin": "/home/joe/.local/share/claude/versions/2.1.153"}'
  size_class: large
  knowledge_cutoff: 2025-06

# The same DeepSeek model through the OpenAI-compatible basic harness, for an
# agent-vs-agent comparison on the identical model. cost_model is a JSON string.
- name: raw-api-loop/deepseek
  model: deepseek-chat            # VERIFY-AT-WIRING: real OpenAI-compat model id
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: deepseek-api-key  # value from $DEEPSEEK_API_KEY on the host
  cost_model: '{"base_url": "https://api.deepseek.com", "input_usd_per_mtok": 0.14, "output_usd_per_mtok": 0.28}'
  size_class: large
  knowledge_cutoff: 2025-06

# MiMo (Xiaomi) on both shared harnesses, like DeepSeek (platform.xiaomimimo.com).
# Host is REGION-SPECIFIC to the account: Token-Plan (`tp-` keys) is
# token-plan-<region>.xiaomimimo.com (e.g. -sgp Singapore, -cn China); pay-as-you-go
# (`sk-` keys) is api.xiaomimimo.com. Models: mimo-v2.5-pro / mimo-v2.5. The -sgp
# host below is verified working for a Singapore token plan — adjust to your region.
# MiMo pricing (overseas/USD tier, matching the -sgp endpoint): mimo-v2.5-pro
# 0.20/0.40, mimo-v2.5 0.08/0.16. Xiaomi cut MiMo prices sharply on 2026-05-27;
# these are the post-cut rates — re-verify if they move again.
# CLIENT PIN: MiMo's anthropic proxy rejects Claude Code 2.1.156's `system`-in-messages
# shape identically to DeepSeek (400 "messages[1].role ... got 'system'"), so this
# competitor is pinned to 2.1.153 via claude_bin too (see claude-code/deepseek note).
- name: claude-code/mimo
  model: mimo-v2.5-pro
  runtime: claude-code
  tool_profile: read-grep
  auth_profile: mimo-anthropic
  cost_model: '{"anthropic_base_url": "https://token-plan-sgp.xiaomimimo.com/anthropic", "env": {"ANTHROPIC_MODEL": "mimo-v2.5-pro", "ANTHROPIC_DEFAULT_SONNET_MODEL": "mimo-v2.5-pro", "ANTHROPIC_DEFAULT_OPUS_MODEL": "mimo-v2.5-pro", "ANTHROPIC_DEFAULT_HAIKU_MODEL": "mimo-v2.5-pro"}, "input_usd_per_mtok": 0.2, "output_usd_per_mtok": 0.4, "claude_bin": "/home/joe/.local/share/claude/versions/2.1.153"}'
  knowledge_cutoff: 2025-06

- name: raw-api-loop/mimo
  model: mimo-v2.5-pro
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: mimo-api-key      # value from $MIMO_API_KEY on the host
  cost_model: '{"base_url": "https://token-plan-sgp.xiaomimimo.com/v1", "input_usd_per_mtok": 0.2, "output_usd_per_mtok": 0.4}'
  knowledge_cutoff: 2025-06

# Native agent CLI, bind-mounted (subscription sign-in on the host, no key). `agy`
# is the Antigravity / Gemini CLI (it replaced `gemini`); Claude-Code-like, plain
# text out, no -m (the model is the signed-in account's default).
- name: agy/antigravity
  model: antigravity              # informational: agy has no model flag
  runtime: agy
  tool_profile: read-grep
  knowledge_cutoff: 2025-06

# Gemini through its OpenAI-compatible endpoint, on the shared raw-api-loop harness
# (apples-to-apples with the other raw-api competitors). The `agy` CLI above refuses
# the audit (its wrapper trips a safety filter) and scores as `refused`; the direct
# API engages the identical prompt at default safety. Needs a Google AI Studio key
# ($GEMINI_API_KEY on the host). All three below share one auth profile + endpoint;
# they differ only by `model`.
#
# CAVEAT: recency does NOT guarantee engagement — gate each model's *engagement*
# before trusting its score. Live-checked 2026-05-28 on junrar GHSA-j273 (CWE-22):
#   gemini-2.5-pro          -> HIT (baseline)
#   gemini-3.1-pro-preview  -> HIT (judged same_bug)
#   gemini-3.5-flash        -> engaged, real CWE-22 findings; MISS on this one case
#                              (adjacency noise — n=1, averages out over the matrix)
#   gemini-3-flash-preview  -> REFUSES at default safety (would only score `refused`;
#                              NOT added below for that reason)
#
# COST: the compat endpoint returns token usage but no dollar cost, so the
# raw-api-loop harness computes it from the per-MTok prices below (standard tier,
# <200k-token prompts; verified against ai.google.dev/gemini-api/docs/pricing on
# 2026-05-28). These are reasoning models — they bill "thinking" tokens at the
# output rate, which the compat layer reports in total_tokens but not in
# completion_tokens; the harness derives output as total-prompt so those are
# counted (see usage_delta in raw_api_loop.py).
- name: raw-api-loop/gemini
  model: gemini-2.5-pro
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: gemini-openai     # value from $GEMINI_API_KEY on the host
  cost_model: '{"base_url": "https://generativelanguage.googleapis.com/v1beta/openai", "input_usd_per_mtok": 1.25, "output_usd_per_mtok": 10.0}'
  knowledge_cutoff: 2025-01

# Newer Gemini, same endpoint/auth. 3.1-pro-preview is the stronger contender (clean
# judged HIT); 3.5-flash is the low-cost near-frontier entry — likely not a top
# contender, but cheap to include and useful to compare against the other low-cost
# near-frontier models.
- name: raw-api-loop/gemini-3.1-pro-preview
  model: gemini-3.1-pro-preview
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: gemini-openai
  cost_model: '{"base_url": "https://generativelanguage.googleapis.com/v1beta/openai", "input_usd_per_mtok": 2.0, "output_usd_per_mtok": 12.0}'
  knowledge_cutoff: 2025-01

- name: raw-api-loop/gemini-3.5-flash
  model: gemini-3.5-flash
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: gemini-openai
  cost_model: '{"base_url": "https://generativelanguage.googleapis.com/v1beta/openai", "input_usd_per_mtok": 1.5, "output_usd_per_mtok": 9.0}'
  knowledge_cutoff: 2026-01

# Wired but stubbed (no key/CLI yet): present so they enter the matrix the moment
# creds/binaries arrive; until then each cleanly resolves to auth_failed/infra_error.
#
# kimi is COMMENTED OUT until a Moonshot key exists: raw-api-loop hits a REAL endpoint,
# so a missing key yields auth_failed — and 3 consecutive auth_failed trip the loop's
# circuit breaker, which then aborts the rest of the matrix (it can't tell a keyless
# stub from an expired host login). That starved raw-api-loop/mimo of all its cells in
# the 2026-05-28 run. Re-enable (uncomment) the moment $MOONSHOT_API_KEY is on the host.
# (pi-custom/mimo is safe to keep: its runtime binary is absent, so it resolves to
# infra_error, which does NOT count toward the auth breaker.)
# - name: raw-api-loop/kimi
#   model: kimi-k2.6                # VERIFY-AT-WIRING: real model id
#   runtime: raw-api-loop
#   tool_profile: read-grep
#   auth_profile: kimi-api-key
#   cost_model: '{"base_url": "https://api.moonshot.ai/v1", "input_usd_per_mtok": 0.95, "output_usd_per_mtok": 4.0}'
#   knowledge_cutoff: 2025-06

- name: pi-custom/mimo
  model: mimo-v2.5
  runtime: pi-custom
  tool_profile: read-grep
  auth_profile: mimo-api-key
  cost_model: '{"input_usd_per_mtok": 0.08, "output_usd_per_mtok": 0.16}'
  knowledge_cutoff: 2025-06
