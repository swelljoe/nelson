# Qwen AgentWorld 35B-A3B (self-hosted, 8-bit MoE) added to the baseline 9-vuln
# benchmark in nelson.db (2026-06-25). A small Qwen-series MoE trained for
# agentic use; served via llama-server on the Strix Halo box at 10.20.30.2:8080
# (same host that previously ran qwen3.6-35b-A3b — now loaded with AgentWorld).
#
# Model id must match the server's loaded id EXACTLY (verified live via
# /v1/models): unsloth/Qwen-AgentWorld-35B-A3B-GGUF:UD-Q8_K_XL. Native
# tool-calling confirmed (finish_reason=tool_calls on a probe). FREE (local).
