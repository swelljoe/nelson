vet_notes: 'The advisory (CWE-863 privilege escalation via token) matches the fix:
  the pre-patch `Controller::requireToken()` shown in the diff only checks `!$this->request->getHadToken()`
  — i.e. that *a* valid token exists — rather than verifying the token''s route matches
  the requested route, so any valid token (e.g. one minted for a low-privilege route)
  could be replayed against the impersonate endpoint. That vulnerable line is present
  in the removed/context lines, and a capable model with the full source could plausibly
  spot the missing token-to-route binding, though it requires cross-file reasoning
  about the token system rather than a single obvious line.'
