vet_notes: 'The advisory and the one-line fix describe the same real bug: when writing
  into the internal temp buffer (stride nTempStep), the pre-patch bounds check at
  planar.c:969 validates against the caller-provided nDstStep rather than nTempStep,
  permitting an OOB heap write — clearly present in the removed/context lines, not
  a version bump or hardening. A capable model reading the pre-patch code can plausibly
  spot the wrong-stride bounds check, though it must connect that pTempData is sized
  by nTempStep, which is a moderately subtle inference.'
description: 'Heap-buffer-overflow write in FreeRDP''s planar bitmap decoder: freerdp_bitmap_decompress_planar()
  in libfreerdp/codec/planar.c validates the X destination coordinate nXDst against
  the caller-provided nDstStep even when writing into the internal temp buffer pTempData,
  instead of the temp stride nTempStep, allowing an out-of-bounds heap write.'
