vet_notes: The advisory (heap overflow in MVG pattern rendering via CopyMagickString
  lacking a bounds check) precisely matches the fix, which adds an upper-bound guard
  `(q-p+4+1) > MagickPathExtent` to two parsing sites that previously only validated
  the lower bound `(q-4) < p`; the missing length check on a MagickPathExtent-sized
  destination buffer is a genuine, model-findable overflow rather than a hardening/version
  bump. Confidence is slightly reduced because the diff shows only the guard, not
  the CopyMagickString call/buffer declaration, so identifiability depends on the
  model reading the surrounding function.
