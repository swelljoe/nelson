[project]
name = "nelson"
version = "0.1.0"
description = "AI-driven vulnerability scanner orchestrator"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1a7",
    "pytest>=8.0",
]

[project.scripts]
nelson = "nelson.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "SIM", "RUF"]
ignore = [
    "S603",   # subprocess calls are intentional
    "S607",   # partial executable paths (git, claude) are fine
]

[tool.ruff.lint.per-file-ignores]
"nelson/cwe.py" = ["E501"]    # Long example strings
"nelson/db.py" = ["E501", "S101"]  # SQL strings, asserts for type narrowing
"nelson/review.py" = ["E501"] # Long prompt strings
"nelson/html_report.py" = ["E501"] # Inline CSS and HTML strings
"tests/*" = ["S101", "S105", "S106"]  # asserts + fake env-var-name fixtures
# bench-scripts/: benchmark orchestrators, analyzers and HTML-report generators.
# They carry long inline CSS/HTML/SQL strings, so waive line-length across the
# tree; real lints (F/B/S/SIM/RUF) still apply to the active tools.
"bench-scripts/**" = ["E501"]
# Parameterized dynamic-IN SQL: only `?` placeholders are interpolated into the
# query string, never user values, so the flagged construction is safe.
"bench-scripts/lib/clear_competitor_runs.py" = ["E501", "S608"]
# bench-scripts/archive/: frozen one-shot scripts kept for provenance only (already
# applied to the baseline, not part of any workflow) — exempt from style lints.
"bench-scripts/archive/*" = ["E501", "S112", "SIM115", "RUF059"]

[tool.ty.src]
# bench-scripts/archive/ holds frozen one-shot scripts kept for provenance only;
# they are not maintained code, so exempt them from type checking (the active
# bench-scripts tools are still checked).
exclude = ["bench-scripts/archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
