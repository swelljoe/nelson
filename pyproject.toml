[project]
name = "nelson"
version = "0.1.0"
description = "AI-driven vulnerability scanner orchestrator"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[project.scripts]
nelson = "nelson.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "B", "SIM", "RUF"]
ignore = [
    "S603",   # subprocess calls are intentional
    "S607",   # partial executable paths (git, claude) are fine
]

[tool.ruff.lint.per-file-ignores]
"nelson/cwe.py" = ["E501"]    # Long example strings
"nelson/db.py" = ["E501", "S101"]  # SQL strings, asserts for type narrowing
"nelson/review.py" = ["E501"] # Long prompt strings
