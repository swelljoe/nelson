vet_notes: 'The advisory (RCE via submodule `update = !command` from a malicious .gitmodules)
  matches the fix, which corrects a genuine logic flaw present in the pre-patch code:
  the guard checks whether *any* foreign-section value exists for the submodule rather
  than whether the *actually-returned* value came from the untrusted modules file,
  so a command from .gitmodules slips through whenever an unrelated foreign section
  is also present. It is a real authorization/source-confusion bug (CWE-349), not
  a version bump, and is localized to one function with an evident security intent,
  though pinpointing it requires understanding gix-config''s last-wins string() vs.
  any-section semantics, which makes it moderately rather than trivially findable.'
