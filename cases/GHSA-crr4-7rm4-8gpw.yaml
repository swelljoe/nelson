vet_notes: 'The advisory matches the fix: the pre-patch blocklist (`IP4_CIDR_LIST`
  + IPv6 ranges) genuinely omits the IPv6 unspecified address `::/128`, and `::` is
  not caught by `loopback?`/`private?`, so the SSRF bypass is really present in the
  shown code. However, the vulnerability is a *missing entry* in a blocklist rather
  than affirmatively wrong logic, so a model must independently know that `::` is
  a dangerous address that ought to be blocked and notice its absence — findable for
  an SSRF-aware model but notably harder than spotting a flawed check.'
