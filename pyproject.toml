[project]
name = "nelson"
version = "0.1.0"
description = "AI-driven vulnerability scanner orchestrator"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
]

[project.scripts]
nelson = "nelson.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
