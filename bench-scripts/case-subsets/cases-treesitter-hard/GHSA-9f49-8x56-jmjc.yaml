vet_notes: The pre-patch code unconditionally does `*meta = (*meta)->next` whenever
  `meta != &node->meta`, without checking that the freed node `meta2` is actually
  the current head `*meta`, corrupting the list head and leading to a heap use-after-free
  write consistent with the CWE-416 advisory; the fix is a genuine logic correction
  (adding the `meta2 == *meta` guard), not a version bump or hardening. The flaw is
  subtle but a careful model reasoning about list-head invariants around the adjacent
  `lyd_free_meta_single` could plausibly spot the missing guard.
description: Heap use-after-free write in metadata list management during XML data
  parsing due to incorrect list head pointer update
