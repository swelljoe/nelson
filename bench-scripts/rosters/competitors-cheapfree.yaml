# Cheap/free cohort for the experimental dataset (nelson-exp.db) — a separate
# data set from nelson.db so prompt/tool/repeat experiments don't munge the
# baseline. Six competitors: DeepSeek + MiMo (cheap direct APIs), local Qwen
# (free, self-hosted), and the three genuinely-free OpenRouter endpoints
# (nemotron :free, owl-alpha stealth, laguna :free). All on the shared
# raw-api-loop harness with the same read-grep tool profile and the uniform
# prompt — apples-to-apples, baseline replication for the free tier.
#
# Fields copied verbatim from competitors.example.yaml; the ONLY change is
# local Qwen's http_timeout, raised 1800 -> 3600 to give it a full hour per
# turn on the heavy freerdp case (paired with --timeout 3600 on the loop).

# DeepSeek pinned to explicit ids (the `deepseek-chat` alias silently routes to
# v4-pro OR v4-flash). Both tiers as separate competitors. PRICING VERIFY-AT-WIRING.
- name: raw-api-loop/deepseek-pro
  model: deepseek-v4-pro
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: deepseek-api-key  # value from $DEEPSEEK_API_KEY on the host
  # DeepSeek pro PROMOTIONAL pricing (2026-05-31, until promo ends): cache-MISS
  # input 0.435 / cache-HIT 0.003625 / output 0.87. input rate = MISS/list;
  # compute_cost is cache-blind → overcounts. cache-hit stashed for the fix.
  cost_model: '{"base_url": "https://api.deepseek.com", "input_usd_per_mtok": 0.435, "input_cache_hit_usd_per_mtok": 0.003625, "output_usd_per_mtok": 0.87}'
  size_class: large
  knowledge_cutoff: 2025-06

- name: raw-api-loop/deepseek-flash
  model: deepseek-v4-flash
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: deepseek-api-key
  # DeepSeek flash (verified 2026-05-31): cache-MISS input 0.14 / cache-HIT 0.0028
  # / output 0.28. input rate is the MISS/list rate; compute_cost is cache-blind so
  # recorded cost OVERCOUNTS. input_cache_hit_usd_per_mtok stashed for the fix.
  cost_model: '{"base_url": "https://api.deepseek.com", "input_usd_per_mtok": 0.14, "input_cache_hit_usd_per_mtok": 0.0028, "output_usd_per_mtok": 0.28}'
  size_class: medium
  knowledge_cutoff: 2025-06

- name: raw-api-loop/mimo
  model: mimo-v2.5-pro
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: mimo-api-key       # value from $MIMO_API_KEY on the host
  cost_model: '{"base_url": "https://token-plan-sgp.xiaomimimo.com/v1", "input_usd_per_mtok": 0.2, "output_usd_per_mtok": 0.4}'
  size_class: large
  knowledge_cutoff: 2025-06

# Local Qwen 3.6 27B on the dual V620 (llama-server). FREE. http_timeout back to
# 1800 (the known-good value behind the prior 8/9 run): raising it to 3600 was a
# mistake — llama-server intermittently HANGS on the first generation call (5/15
# cells in the 2026-05-31 run produced zero turns and timed out at exactly 3610s,
# scattered across files regardless of size). A hung call doesn't recover by
# waiting; a shorter http_timeout cuts the dead call fast instead of burning an
# hour. Completing cells finish in 750-1590s, comfortably under 1800.
- name: raw-api-loop/qwen3.6-27b
  model: unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q8_K_XL # must match the server's loaded model id exactly
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: lmstudio-api-key   # any non-empty value from $LMSTUDIO_API_KEY on the host
  cost_model: '{"base_url": "http://10.20.30.1:8000/v1", "http_timeout": 1800}'
  size_class: small
  knowledge_cutoff: 2025-06

# Local Qwen MoE on the Strix Halo (llama-server). FREE. Same timeout as above,
# though the MoE is at least twice as fast even on the slower hardware.
- name: raw-api-loop/qwen3.6-35b-A3b
  model: unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL # must match the server's loaded model id exactly
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: lmstudio-api-key   # any non-empty value from $LMSTUDIO_API_KEY on the host
  cost_model: '{"base_url": "http://10.20.30.2:8080/v1", "http_timeout": 1800}'
  size_class: small
  knowledge_cutoff: 2025-06

# ── Free OpenRouter endpoints (one openrouter-api-key) ───────────────────────
- name: raw-api-loop/nemotron-3-super-120b
  model: nvidia/nemotron-3-super-120b-a12b:free
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: openrouter-api-key
  cost_model: '{"base_url": "https://openrouter.ai/api/v1", "input_usd_per_mtok": 0.09, "output_usd_per_mtok": 0.45}'
  size_class: small   # 120b-a12b: self-hostable, smaller class than the 550b-a55b "medium"
  knowledge_cutoff: 2025-06

- name: raw-api-loop/owl-alpha
  model: openrouter/owl-alpha
  runtime: raw-api-loop
  tool_profile: read-grep
  auth_profile: openrouter-api-key
  cost_model: '{"base_url": "https://openrouter.ai/api/v1"}'
  size_class: large
  knowledge_cutoff: 2025-06

